<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DNA Explorer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0a0e1a;
    color: #e8eaf0;
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
  }

  .bg-glow {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(ellipse 60% 40% at 20% 50%, rgba(93,202,165,0.07) 0%, transparent 70%),
      radial-gradient(ellipse 50% 50% at 80% 40%, rgba(175,169,236,0.07) 0%, transparent 70%);
  }

  .container {
    position: relative; z-index: 1;
    width: 100%; max-width: 820px;
    padding: 32px 24px 40px;
    display: flex; flex-direction: column; gap: 18px;
  }

  header { display: flex; align-items: baseline; gap: 12px; }

  h1 {
    font-family: 'Space Mono', monospace;
    font-size: 22px; font-weight: 700;
    letter-spacing: -0.5px; color: #e8eaf0;
  }

  .tag {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    background: rgba(93,202,165,0.15);
    color: #5DCAA5;
    border: 1px solid rgba(93,202,165,0.3);
    border-radius: 4px;
    padding: 2px 8px;
    letter-spacing: 0.05em;
  }

  .controls {
    display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
  }

  .ctrl {
    display: flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    padding: 8px 12px;
  }

  .ctrl label {
    font-size: 12px; color: rgba(232,234,240,0.5);
    white-space: nowrap; font-family: 'Space Mono', monospace;
  }

  .ctrl span {
    font-size: 12px; font-family: 'Space Mono', monospace;
    color: #5DCAA5; min-width: 22px; text-align: right;
  }

  input[type=range] {
    -webkit-appearance: none;
    width: 80px; height: 3px;
    background: rgba(255,255,255,0.12);
    border-radius: 2px; outline: none; cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    background: #5DCAA5; border-radius: 50%;
    box-shadow: 0 0 6px rgba(93,202,165,0.5);
  }

  button {
    font-family: 'DM Sans', sans-serif;
    font-size: 13px; font-weight: 500;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.12);
    color: #e8eaf0; border-radius: 8px;
    padding: 8px 14px; cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  button:hover {
    background: rgba(93,202,165,0.12);
    border-color: rgba(93,202,165,0.4);
    color: #5DCAA5;
  }

  .canvas-wrap {
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 16px; overflow: hidden;
    background: rgba(255,255,255,0.02);
  }

  canvas { display: block; cursor: grab; touch-action: none; width: 100%; }
  canvas:active { cursor: grabbing; }

  .info-bar {
    font-family: 'Space Mono', monospace;
    font-size: 12px; color: rgba(232,234,240,0.45);
    text-align: center; min-height: 18px; letter-spacing: 0.02em;
  }

  .legend {
    display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
  }
  .legend-item {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; font-family: 'Space Mono', monospace;
    color: rgba(232,234,240,0.55);
  }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; }

  .seq-display {
    font-family: 'Space Mono', monospace;
    font-size: 12px; color: rgba(232,234,240,0.4);
    text-align: center; letter-spacing: 0.1em;
    word-break: break-all; line-height: 1.8;
  }
  .seq-display .hov { color: #5DCAA5; }
</style>
</head>
<body>
<div class="bg-glow"></div>
<div class="container">
  <header>
    <h1>DNA Explorer</h1>
    <span class="tag">interactive</span>
  </header>

  <div class="controls">
    <div class="ctrl">
      <label>BASES</label>
      <input type="range" id="sl-bases" min="6" max="40" value="18" step="1">
      <span id="bases-val">18</span>
    </div>
    <div class="ctrl">
      <label>SPEED</label>
      <input type="range" id="sl-speed" min="0" max="10" value="3" step="1">
    </div>
    <div class="ctrl">
      <label>ZOOM</label>
      <input type="range" id="sl-zoom" min="60" max="200" value="110" step="1">
    </div>
    <button onclick="generateNew()">New strand &#x21BB;</button>
    <button id="btn-labels" onclick="toggleLabels()">Labels: on</button>
  </div>

  <div class="canvas-wrap">
    <canvas id="dna-canvas" width="760" height="460"></canvas>
  </div>

  <div class="info-bar" id="info-bar">Drag to rotate &middot; Scroll to zoom &middot; Hover a base pair to inspect</div>

  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#5DCAA5;border:1.5px solid #0F6E56"></div>Adenine (A)</div>
    <div class="legend-item"><div class="legend-dot" style="background:#FAC775;border:1.5px solid #854F0B"></div>Thymine (T)</div>
    <div class="legend-item"><div class="legend-dot" style="background:#AFA9EC;border:1.5px solid #3C3489"></div>Guanine (G)</div>
    <div class="legend-item"><div class="legend-dot" style="background:#F0997B;border:1.5px solid #993C1D"></div>Cytosine (C)</div>
  </div>

  <div class="seq-display" id="seq-display"></div>
</div>

<script>
var canvas = document.getElementById('dna-canvas');
var ctx = canvas.getContext('2d');
var W = canvas.width;
var H = canvas.height;

var BASE_PAIRS = { A:'T', T:'A', G:'C', C:'G' };
var BASE_COLORS = {
  A: { fill:'#5DCAA5', stroke:'#0F6E56' },
  T: { fill:'#FAC775', stroke:'#854F0B' },
  G: { fill:'#AFA9EC', stroke:'#3C3489' },
  C: { fill:'#F0997B', stroke:'#993C1D' }
};
var BASE_NAMES = { A:'Adenine', T:'Thymine', G:'Guanine', C:'Cytosine' };

var bases = 18;
var rotX = 0.3;
var rotY = 0;
var autoSpeed = 3;
var zoom = 110;
var showLabels = true;
var sequence = [];
var dragging = false;
var lastX = 0;
var lastY = 0;
var hoveredPair = -1;
var pairScreenPos = [];

function generateNew() {
  var pool = ['A','T','G','C'];
  sequence = [];
  for (var i = 0; i < bases; i++) {
    sequence.push(pool[Math.floor(Math.random() * 4)]);
  }
  hoveredPair = -1;
  updateSeqDisplay();
}

function updateSeqDisplay() {
  var el = document.getElementById('seq-display');
  var html = "5\u2019\u2013";
  for (var i = 0; i < sequence.length; i++) {
    html += '<span id="sb' + i + '">' + sequence[i] + '</span>';
  }
  html += "\u20133\u2019";
  el.innerHTML = html;
}

function toggleLabels() {
  showLabels = !showLabels;
  document.getElementById('btn-labels').textContent = 'Labels: ' + (showLabels ? 'on' : 'off');
}

document.getElementById('sl-bases').addEventListener('input', function(e) {
  bases = parseInt(e.target.value);
  document.getElementById('bases-val').textContent = bases;
  generateNew();
});

document.getElementById('sl-speed').addEventListener('input', function(e) {
  autoSpeed = parseInt(e.target.value);
});

document.getElementById('sl-zoom').addEventListener('input', function(e) {
  zoom = parseInt(e.target.value);
});

canvas.addEventListener('mousedown', function(e) {
  dragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
});

canvas.addEventListener('mousemove', function(e) {
  if (dragging) {
    rotY += (e.clientX - lastX) * 0.012;
    rotX += (e.clientY - lastY) * 0.008;
    if (rotX > 1.2) rotX = 1.2;
    if (rotX < -1.2) rotX = -1.2;
    lastX = e.clientX;
    lastY = e.clientY;
  }
  var rect = canvas.getBoundingClientRect();
  var scaleX = W / rect.width;
  var scaleY = H / rect.height;
  checkHover((e.clientX - rect.left) * scaleX, (e.clientY - rect.top) * scaleY);
});

canvas.addEventListener('mouseup', function() { dragging = false; });
canvas.addEventListener('mouseleave', function() { dragging = false; hoveredPair = -1; });

canvas.addEventListener('wheel', function(e) {
  e.preventDefault();
  zoom = zoom - e.deltaY * 0.3;
  if (zoom < 60) zoom = 60;
  if (zoom > 200) zoom = 200;
  document.getElementById('sl-zoom').value = Math.round(zoom);
}, { passive: false });

canvas.addEventListener('touchstart', function(e) {
  lastX = e.touches[0].clientX;
  lastY = e.touches[0].clientY;
}, { passive: true });

canvas.addEventListener('touchmove', function(e) {
  if (e.touches.length === 1) {
    rotY += (e.touches[0].clientX - lastX) * 0.014;
    rotX += (e.touches[0].clientY - lastY) * 0.010;
    if (rotX > 1.2) rotX = 1.2;
    if (rotX < -1.2) rotX = -1.2;
    lastX = e.touches[0].clientX;
    lastY = e.touches[0].clientY;
  }
}, { passive: true });

function checkHover(mx, my) {
  var found = -1;
  for (var i = 0; i < pairScreenPos.length; i++) {
    var p = pairScreenPos[i];
    if (Math.abs(mx - p.cx) < 40 && Math.abs(my - p.cy) < 14) {
      found = i;
      break;
    }
  }
  if (found !== hoveredPair) {
    hoveredPair = found;
    var spans = document.querySelectorAll('#seq-display span');
    for (var j = 0; j < spans.length; j++) {
      if (j === found) {
        spans[j].classList.add('hov');
      } else {
        spans[j].classList.remove('hov');
      }
    }
    if (found >= 0) {
      var b = sequence[found];
      var comp = BASE_PAIRS[b];
      var bonds = (b === 'A' || b === 'T') ? '2 hydrogen bonds' : '3 hydrogen bonds';
      document.getElementById('info-bar').textContent =
        'Pair ' + (found + 1) + ': ' + b + '\u2013' + comp +
        '  \u00b7  ' + BASE_NAMES[b] + '\u2013' + BASE_NAMES[comp] + ' \u00b7 ' + bonds;
    } else {
      document.getElementById('info-bar').textContent =
        'Drag to rotate \u00b7 Scroll to zoom \u00b7 Hover a base pair to inspect';
    }
  }
}

function project(x, y, z) {
  var cosX = Math.cos(rotX);
  var sinX = Math.sin(rotX);
  var cosY = Math.cos(rotY);
  var sinY = Math.sin(rotY);
  var nx = cosY * x + sinY * z;
  var ny = sinX * sinY * x + cosX * y - sinX * cosY * z;
  var nz = -cosX * sinY * x + sinX * y + cosX * cosY * z;
  var fov = 800;
  var scale = fov / (fov + nz + 200);
  return { sx: nx * scale + W / 2, sy: ny * scale + H / 2, depth: nz };
}

function drawNode(pt, col, lbl, nodeR, isHov) {
  if (isHov) {
    ctx.beginPath();
    ctx.arc(pt.sx, pt.sy, nodeR + 6, 0, Math.PI * 2);
    ctx.fillStyle = col.fill + '28';
    ctx.fill();
  }
  ctx.beginPath();
  ctx.arc(pt.sx, pt.sy, nodeR, 0, Math.PI * 2);
  ctx.fillStyle = col.fill;
  ctx.fill();
  ctx.strokeStyle = col.stroke;
  ctx.lineWidth = 1.5;
  ctx.stroke();
  if (showLabels) {
    ctx.font = (isHov ? '700' : '500') + ' ' + (isHov ? '13' : '11') + "px 'Space Mono', monospace";
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = col.stroke;
    ctx.fillText(lbl, pt.sx, pt.sy);
  }
}

function drawBackbone(pts, color, alpha) {
  ctx.globalAlpha = alpha;
  ctx.beginPath();
  for (var i = 0; i < pts.length; i++) {
    if (i === 0) {
      ctx.moveTo(pts[i].sx, pts[i].sy);
    } else {
      ctx.lineTo(pts[i].sx, pts[i].sy);
    }
  }
  ctx.strokeStyle = color;
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.stroke();
  ctx.globalAlpha = 1;
}

function drawFrame() {
  ctx.clearRect(0, 0, W, H);
  var n = sequence.length;
  if (!n) return;

  var helixR = zoom * 0.45;
  var risePerBase = zoom * 0.22;
  var totalH = risePerBase * (n - 1);
  var twistPerBase = (Math.PI * 2) / 10;

  pairScreenPos = [];
  var backboneL = [];
  var backboneR = [];
  var pairData = [];

  for (var i = 0; i < n; i++) {
    var angle = i * twistPerBase;
    var yPos = i * risePerBase - totalH / 2;
    var lx = Math.cos(angle) * helixR;
    var lz = Math.sin(angle) * helixR;
    var rx = Math.cos(angle + Math.PI) * helixR;
    var rz = Math.sin(angle + Math.PI) * helixR;
    var pl = project(lx, yPos, lz);
    var pr = project(rx, yPos, rz);
    backboneL.push(pl);
    backboneR.push(pr);
    pairData.push({ pl: pl, pr: pr, idx: i });
    pairScreenPos.push({ cx: (pl.sx + pr.sx) / 2, cy: (pl.sy + pr.sy) / 2 });
  }

  var depthOrder = pairData.slice().sort(function(a, b) {
    return b.pl.depth - a.pl.depth;
  });

  drawBackbone(backboneL, '#1a2a3a', 0.9);
  drawBackbone(backboneR, '#1a2a3a', 0.9);

  for (var d = 0; d < depthOrder.length; d++) {
    var pair = depthOrder[d];
    var pl = pair.pl;
    var pr = pair.pr;
    var idx = pair.idx;
    var b = sequence[idx];
    var bc = BASE_COLORS[b];
    var comp = BASE_PAIRS[b];
    var cc = BASE_COLORS[comp];
    var isHov = (hoveredPair === idx);
    var cx = (pl.sx + pr.sx) / 2;
    var cy = (pl.sy + pr.sy) / 2;
    var dx = pr.sx - pl.sx;
    var dy = pr.sy - pl.sy;
    var len = Math.sqrt(dx * dx + dy * dy) || 1;
    var ux = dx / len;
    var uy = dy / len;
    var nodeR = isHov ? 15 : 11;
    var gap = Math.max(len * 0.06, 4);

    ctx.globalAlpha = isHov ? 1 : 0.85;

    ctx.beginPath();
    ctx.moveTo(pl.sx + ux * nodeR, pl.sy + uy * nodeR);
    ctx.lineTo(cx - ux * gap, cy - uy * gap);
    ctx.strokeStyle = bc.stroke;
    ctx.lineWidth = isHov ? 4.5 : 3;
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(cx + ux * gap, cy + uy * gap);
    ctx.lineTo(pr.sx - ux * nodeR, pr.sy - uy * nodeR);
    ctx.strokeStyle = cc.stroke;
    ctx.lineWidth = isHov ? 4.5 : 3;
    ctx.stroke();

    ctx.globalAlpha = 1;
  }

  drawBackbone(backboneL, '#3a6a9a', 0.9);
  drawBackbone(backboneR, '#3a6a9a', 0.9);

  for (var d = 0; d < depthOrder.length; d++) {
    var pair = depthOrder[d];
    var pl = pair.pl;
    var pr = pair.pr;
    var idx = pair.idx;
    var b = sequence[idx];
    var bc = BASE_COLORS[b];
    var comp = BASE_PAIRS[b];
    var cc = BASE_COLORS[comp];
    var isHov = (hoveredPair === idx);
    var nodeR = isHov ? 15 : 11;

    ctx.globalAlpha = isHov ? 1 : 0.97;
    drawNode(pl, bc, b, nodeR, isHov);
    drawNode(pr, cc, comp, nodeR, isHov);
    ctx.globalAlpha = 1;
  }
}

function loop() {
  if (!dragging && autoSpeed > 0) {
    rotY += autoSpeed * 0.0004;
  }
  drawFrame();
  requestAnimationFrame(loop);
}

generateNew();
loop();
</script>
</body>
</html>
